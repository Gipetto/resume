  remote: true
  positions:
  - from:
      month: 3
      year: 2024
    to:
      month: 12
      year: 2025
    title: Software Engineer, Contractor
    description:
    - Engineered custom web applications and sites for a diverse client portfolio,
      utilizing a modern technology stack including Next.js, Python, Django, Golang,
      and WordPress.
    - Built responsive, accessible, and user-friendly interfaces from design mockups,
      leveraging CSS frameworks like Bootstrap and Tailwind CSS, and extending WordPress
      with custom themes and plugins.
    - Partnered directly with project managers and clients to translate business objectives
      and complex requirements into actionable technical plans and scoped deliverables.
    - Implemented and maintained automated CI/CD pipelines to streamline deployment
      and testing processes across various hosting environments, including WPEngine
      and client-managed infrastructure.
- company: Career Break
  positions:
  - description:
    - Launched a trivia game (quizstreak.com) with Svelte/SvelteKit & Supabase, diving
      deep into modern web development, game design, and statistics.
    - Got hands-on with Kubernetes by building local clusters from scratch, moving
      beyond just using them to truly understanding how they work under the hood.
    - Took a break after 11 years in the startup grind to recharge, retool, and return
      to work with fresh energy and new perspectives.
- company: RevOps
  location: Berkeley, CA
  remote: true
  positions:
  - from:
      month: 4
      year: 2022
    to:
      month: 3
      year: 2023
    title: Lead Software Engineer
    description:
    - Led a small, agile engineering team in developing product growth features, working
      closely with Product, Sales, and Support to translate customer and business
      needs into technical solutions.
    - Architected and implemented a full-stack solution for complex, dynamic pricing
      models, building the backend logic in Python and the customer-facing configuration
      interface in React and TypeScript.
    - Supervised remote contractors in finalizing a company-wide Design System, establishing
      consistent design patterns and enforcing high code quality standards across
      the front-end codebase.
    - Improved core web vitals and user experience by analyzing browser bundle composition
      and optimizing dependencies, resulting an approximately 10% reduction in application
      build size.
- company: Twilio
  location: San Francisco, CA
  positions:
  - from:
      month: 7
      year: 2019
    to:
      month: 1
      year: 2022
    title: Staff Software Engineer / Tech Lead, Growth Engineering
    description:
    - Developed scalable, fault-tolerant systems that supported multiple teams in
      onboarding new members and accelerating product adoption through innovative
      application designs and effective cross-team collaboration.
    - Mentored engineers on project and task management, engineering best practices,
      problem-solving, and code quality.
    - Oversaw remote contractors and streamlined team productivity by clarifying expectations
      and task definitions.
  - from:
      month: 6
      year: 2011
    to:
      month: 7
      year: 2019
    title: Senior Software Engineer 1 & 2
    description:
    - Contributed to various teams, including Growth Engineering, Experimentation
      Platform, Phone Numbers, and Console.
    - Enabled teams to make run-time decisions about their customers based on live
      data and computed metrics through a custom built customer data platform integrated
      in to the experimentation platform.
    - Enabled company compliance with international phone number regulations though
      a patented workflow system to provision phone numbers in compliance with worldwide,
      country specific rules.
    - Enabled individual teams to support their own development lifecycles, decrease
      contention over core sections of the codebase, and to adopt and grow their back-end
      services per their own needs by deconstructing a monolithic PHP code base.
    - Drove a culture of testing as a normal part of the development lifecycle Increased
      adoption of technologies and tooling to improve system observability and drive
      down recovery time from errors.
